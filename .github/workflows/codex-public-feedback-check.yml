name: Public feedback anonymous access
on:
  push:
    branches: [codex/public-feedback]
permissions: {}
jobs:
  public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actual anonymous HTTPS responses
        shell: bash
        run: |
          python3 - <<'CHECK'
          import hashlib, time, urllib.request
          expected = {'index.html': 'a7339f3a2448c76359e8e3122c5df4b558ac148b320b0317a048ad80143d78ad', 'app.js': '28fb0940a8ca322b419b371656009331209891dcfd87f49e4d99b9a90b7cb975', 'archive.js': 'f466d2255b04fd13cee6afaaaf57f4e851dbfb0e0b8f209b55986dfe7e79fff6', 'styles.css': '41e949ee528b892e1127a9aba2ad873f6d26e207e80e0fe219cf18a8ef8a6365', 'assets/audio/tap-1.wav': 'bb1d671dbc6b454d71ead9999b192837551f64d06e00d536c9a86211dc5eb77d', '': 'a7339f3a2448c76359e8e3122c5df4b558ac148b320b0317a048ad80143d78ad'}
          for attempt in range(24):
              try:
                  for path, digest in expected.items():
                      request = urllib.request.Request('https://yeonjoo-kim.github.io/80th-Anniversary/feedback/' + path, headers={"User-Agent":"Anonymous-feedback-check"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          assert response.status == 200
                          if path.endswith(".wav"): assert response.headers.get_content_type().startswith("audio/")
                          assert hashlib.sha256(response.read()).hexdigest() == digest, "Snapshot still updating"
                  print("PASS: anonymous HTTPS access; index, script, stylesheet and audio match the published revision")
                  break
              except Exception as error:
                  print(f"Waiting for Pages, attempt {attempt+1}: {type(error).__name__}", flush=True)
                  time.sleep(10)
          else:
              raise SystemExit("Public feedback deployment did not become ready")
          CHECK
