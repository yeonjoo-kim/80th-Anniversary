name: Public feedback anonymous access
on:
  push:
    branches: [codex/public-feedback]
permissions: {}
jobs:
  public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actual anonymous HTTPS responses
        shell: bash
        run: |
          python3 - <<'CHECK'
          import hashlib, time, urllib.request
          expected = {'index.html': 'eeb58322dc451316fc46d640aab9bbaf9568325654db46a5957b758d57c5a545', 'app.js': '747b560157ba8fe4dd9c173372beec823f6b2bf5245b0dfacb0a4d18a03f7802', 'archive.js': '5f14cf56924740d7f52c17144d22b1cc6aa36a165df4478da102c2d7a96400da', 'styles.css': 'b93f2236eacc271d1318ff45dcbf661a2ee114e7eeee7590fdd7638a5a71c1be', 'assets/audio/feedback-sprite.wav': '7c4f293753655fc797ae9202982d05233d870b2e5ddcc2a31fb36bb9c68dab4a', 'assets/back-arrows.json': '6d0ed032a3b1a61592db6c9f620a127a9257137b26a489f69e41f53951b211cc', 'assets/favicon.svg': '0f8535f412890987a770bfa88d5b955f9d16bb854586249c511057fcdbf4ee56', 'assets/process-1.svg': '88ca3b93413ff0e608a117e24e5a4823b00e2ee45dfd24b95553634d64365ec6', 'assets/photo-decoration.svg': 'c58d02e1de806e1e674f6dbf46725d85c599e8ab87d407eac41272c4b50c4bcd', 'assets/apple-touch-icon.png': 'ab04774ee8384c05a17617426bd41938408e2fb1cdd69bd55a894aa0d580d4a3', 'assets/landing.svg': 'dc2d3eec822ae3691d8d80aca99d1a1010280336d4cdc195b5c7b055ecdfcdbf', 'assets/delete.svg': 'a9dfefde628b17fffba0f306ee7bf64df48a19fa07d0ac9dd2ed43ccb2fb222a', 'manifest.webmanifest': '1ec99e5bbfe1daba801a4547d108b80c6cb9950ef463e5498902122c7e9459af', 'assets/audio/session-silence.m4a': 'd9132d5d49ce85b19d0b7bff36259dbe1fc5fa4f56e7177fc0d38a39f3bdee6e', 'assets/audio/tap-1.m4a': '132e731fcda6d2ef1e23c2fac7c8b12efb310822a581c0b4c4fb8cfddd47f060', 'assets/audio/tap-2.m4a': '86607e8001e8190b15648a009139d6f9f5460ddf6152f3e2e925c5b62054c309', 'assets/audio/tap-3.m4a': 'd173d61c577927bdbf55d9f35504b062b406b9317715521edfe397e9f82f16f5', 'assets/audio/tap-4.m4a': '7a8543594d7538139879b243d9736e3ba0e8578ac2cae363c521a79d4540debe', 'assets/audio/tap-5.m4a': 'ccd1621e080b8e8dc002252110d7cacd850beee3568638e5e64d005b1c7b3e77', 'assets/audio/tap-6.m4a': '94f9a4d8fa18be833d8bac5f7e6d0b24bc52eba0357625c4e15005c7ad8954bf', 'assets/audio/tap-7.m4a': '28d9557c6d718c26c5e292ed852e0a01fbc46be8a7421102b6b02b833cd99b32', 'assets/audio/tap-8.m4a': 'd49dc5fbb1d06adaf0d91110e20d5b9fb8823e09a1a8cc3b8ec5a24eb298933d', '': 'eeb58322dc451316fc46d640aab9bbaf9568325654db46a5957b758d57c5a545'}
          for attempt in range(24):
              try:
                  for path, digest in expected.items():
                      request = urllib.request.Request('https://yeonjoo-kim.github.io/80th-Anniversary/feedback/' + path, headers={"User-Agent":"Anonymous-feedback-check"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          assert response.status == 200
                          if path.endswith((".wav", ".m4a")): assert response.headers.get_content_type().startswith("audio/")
                          if path.endswith(".webmanifest"): assert response.headers.get_content_type() in ("application/manifest+json", "application/json")
                          assert hashlib.sha256(response.read()).hexdigest() == digest, "Snapshot still updating"
                  print("PASS: anonymous HTTPS access; index, script, stylesheet and audio match the published revision")
                  break
              except Exception as error:
                  print(f"Waiting for Pages, attempt {attempt+1}: {type(error).__name__}", flush=True)
                  time.sleep(10)
          else:
              raise SystemExit("Public feedback deployment did not become ready")
          CHECK
