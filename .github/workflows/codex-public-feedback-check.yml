name: Public feedback anonymous access
on:
  push:
    branches: [codex/public-feedback]
permissions: {}
jobs:
  public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actual anonymous HTTPS responses
        shell: bash
        run: |
          python3 - <<'CHECK'
          import hashlib, time, urllib.request
          expected = {'index.html': '80b4bf6adc93f39d81cdcc3991489adc09e85ef11ad5042b531b057ce7ab37f9', 'app.js': '64e1e344c3d2368a99b35e940e9335f749fbcdcb40581e7449538ec133d55d48', 'archive.js': 'f466d2255b04fd13cee6afaaaf57f4e851dbfb0e0b8f209b55986dfe7e79fff6', 'styles.css': 'a6b7e78f2efde6b1c69f56b63dd0c56be448213beff0af0ce6b20e5cd677f0fb', 'assets/audio/feedback-sprite.wav': '7c4f293753655fc797ae9202982d05233d870b2e5ddcc2a31fb36bb9c68dab4a', 'assets/back-arrows.json': '6d0ed032a3b1a61592db6c9f620a127a9257137b26a489f69e41f53951b211cc', 'assets/favicon.svg': '0f8535f412890987a770bfa88d5b955f9d16bb854586249c511057fcdbf4ee56', 'assets/process-1.svg': '3e26a99d7242d6984024a3baff212b483abfed57fee860114a2e1c59bf0e0ac9', 'assets/photo-decoration.svg': 'c58d02e1de806e1e674f6dbf46725d85c599e8ab87d407eac41272c4b50c4bcd', 'assets/apple-touch-icon.png': 'ab04774ee8384c05a17617426bd41938408e2fb1cdd69bd55a894aa0d580d4a3', '': '80b4bf6adc93f39d81cdcc3991489adc09e85ef11ad5042b531b057ce7ab37f9'}
          for attempt in range(24):
              try:
                  for path, digest in expected.items():
                      request = urllib.request.Request('https://yeonjoo-kim.github.io/80th-Anniversary/feedback/' + path, headers={"User-Agent":"Anonymous-feedback-check"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          assert response.status == 200
                          if path.endswith(".wav"): assert response.headers.get_content_type().startswith("audio/")
                          assert hashlib.sha256(response.read()).hexdigest() == digest, "Snapshot still updating"
                  print("PASS: anonymous HTTPS access; index, script, stylesheet and audio match the published revision")
                  break
              except Exception as error:
                  print(f"Waiting for Pages, attempt {attempt+1}: {type(error).__name__}", flush=True)
                  time.sleep(10)
          else:
              raise SystemExit("Public feedback deployment did not become ready")
          CHECK
